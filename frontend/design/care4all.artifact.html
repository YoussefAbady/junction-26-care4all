    var yobEl = field(form, 'yob'), yob = parseInt(yobEl.value, 10), bad = null, maxY = D.YEAR - 18;
    if (!/^\d{4}$/.test(yobEl.value.trim()) || yob < 1910 || yob > maxY) {
      showErr(form, 'e-yob', 'Enter a 4-digit year between 1910 and ' + maxY + ', for example 1974. care4all is for adults.', yobEl);
      bad = yobEl;
    }
    var sex = checked(form, 'sex')[0];
    if (!sex) { showErr(form, 'e-sex', 'Choose one option.'); bad = bad || $('input[name="sex"]', form); }
    if (bad) { bad.focus(); A.announce('Please fix the highlighted fields.'); return; }
    S.profile = { name: field(form, 'name').value.trim().slice(0, 40), yob: yob, sex: sex, county: field(form, 'county').value };
    A.save('profile');
    if (mode === 'onboard') A.go('plan');
    else { A.refresh(); A.toast('Saved. Your topics are up to date.'); A.back(); }
  }

  /* ---------- actions ---------- */
  function setLang(l) { S.prefs.lang = l; A.save('prefs'); applyPrefs(); A.refresh(); A.announce(LANG_NAMES[l]); }
  function setSeg(seg, i) { seg.style.setProperty('--i', String(i)); seg.removeAttribute('data-none'); }
  var ACTIONS = {
    back: function () { A.back(); },
    'lang-cycle': function () { var o = ['en', 'fi', 'sv']; setLang(o[(o.indexOf(S.prefs.lang) + 1) % 3]); },
    'lang-menu': function () {
      actionSheet({ title: t('language'), actions: ['en', 'fi', 'sv'].map(function (l) { return { label: LANG_NAMES[l] + (S.prefs.lang === l ? ' ✓' : ''), run: function () { setLang(l); } }; }) });
    },
    info: function (el) { openInfo(el.getAttribute('data-kind')); },
    'sheet-close': function () { A.sheet.close(); },
    'sheet-copy': function () { if (textSheet) doCopy(textSheet.text); },
    'sheet-download': function () { if (textSheet && !download(textSheet.file, textSheet.mime, textSheet.text)) A.toast('Download is not available. Use Copy instead.'); },
    act: function (el) {
      var a = actionList[+el.getAttribute('data-i')];
      A.sheet.close();
      if (a && a.run) setTimeout(a.run, A.reduceMotion() ? 0 : 120);
    },
    'ask-open': function (el) { openAsk(el.getAttribute('data-q') || '', el.getAttribute('data-ctx') || ''); },
    'ask-clear': function () { A.chat.log = []; A.chat.ctx = ''; A.refresh(); A.announce('Conversation cleared'); },
    fight: function () {
      var T = [['checks', 'hand', 'Self-check', 'Guided, step by step'], ['talk', 'chat', 'Talk', 'Ask, or get to know you'], ['symptom', 'heart', 'Talk about symptoms', 'Something feel different?'], ['learn', 'book', 'Learn', 'Cancers and short reads']];
      A.sheet.open({ title: 'What do you want to do?', cls: 'fight', html: '<div class="fight-grid">' + T.map(function (x, i) {
        return '<button class="fg" type="button" style="--i:' + i + '" data-action="fight-go" data-to="' + x[0] + '"><span class="fg-i" aria-hidden="true">' + ic(x[1], 22) + '</span><span class="fg-t">' + x[2] + '</span><span class="fg-s">' + x[3] + '</span></button>';
      }).join('') + '</div>' });
    },
    'fight-go': function (el) {
      var to = el.getAttribute('data-to');
      A.sheet.close(true);
      if (to === 'symptom') A.symStart(''); else A.go(to);
    },
    'read-toggle': function (el) {
      var id = el.getAttribute('data-id'), on = !A.isRead(id);
      A.markRead(id, on);
      el.setAttribute('aria-pressed', String(on)); el.classList.toggle('primary', !on);
      el.innerHTML = on ? ic('check', 18) + ' Read. Tap to mark as not read' : 'Mark as read';
      var st = $('#read-state', top().el); if (st) st.textContent = on ? 'Read' : 'Not read yet';
      A.toast(on ? 'Marked as read. I will not suggest it again.' : 'Marked as not read.');
      A.refresh(true);
    },
    'ask-suggest': function (el) { ask(el.getAttribute('data-q')); },
    seg: function (el) {
      var id = el.getAttribute('data-topic'), p = el.getAttribute('data-p'), tab = el.parentNode, root = el.closest('.screen');
      A.ui.seg[id] = p;
      $$('[role="tab"]', tab).forEach(function (b) { b.setAttribute('aria-selected', String(b === el)); });
      setSeg(tab, +el.getAttribute('data-i'));
      $$('[role="tabpanel"]', root).forEach(function (pn) { pn.hidden = pn.id !== 'p-' + id + '-' + p; });
      A.tap();
    },
    'goto-seg': function (el) {
      var tp = el.getAttribute('data-topic'), pg = el.getAttribute('data-p');
      if (pg === 'how') { A.go('how-' + tp); return; }
      A.ui.seg[tp] = pg; A.go('t-' + tp);
    },
    acc: function (el) {
      var id = el.getAttribute('data-id'), box = document.getElementById(id), open = !box.classList.contains('open');
      box.classList.toggle('open', open);
      el.setAttribute('aria-expanded', String(open));
      A.ui.open[id] = open;
    },
    'search-clear': function () {
      var inp = $('#search', top().el);
      inp.value = ''; A.ui.q = ''; $('#results', top().el).innerHTML = A.searchResults(''); el_toggleClear(false); inp.focus();
    },
    install: function () {
      if (A.deferredInstall) { var d = A.deferredInstall; A.deferredInstall = null; d.prompt(); if (d.userChoice) d.userChoice.then(function () { A.refresh(); }); }
      else openInfo('install');
    },
    'dismiss-install': function () { S.dismissInstall = true; A.save('dismissInstall'); A.refresh(); },
    'reminder-new': function (el) { openReminder(el.getAttribute('data-topic') || '', { kind: el.getAttribute('data-kind') || '', when: el.getAttribute('data-when') || '' }); },
    'reminder-done': function (el) {
      var r = findRem(el.getAttribute('data-id'));
      if (!r) return;
      r.status = r.status === 'done' ? 'active' : 'done'; A.save('reminders'); A.tap(); A.refresh();
    },
    'reminder-menu': function (el) {
      var r = findRem(el.getAttribute('data-id'));
      if (!r) return;
      actionSheet({
        title: A.REM_KINDS[r.kind].label, message: A.fmtDue(r.due) + ' · ' + A.fmtDate(r.due),
        actions: [
          { label: r.status === 'done' ? 'Mark as not done' : 'Mark as done', run: function () { r.status = r.status === 'done' ? 'active' : 'done'; A.save('reminders'); A.refresh(); } },
          { label: 'Add to calendar', run: function () { showIcs(r); } },
          { label: 'Delete reminder', kind: 'destructive', run: function () { S.reminders = S.reminders.filter(function (x) { return x.id !== r.id; }); A.save('reminders'); A.refresh(); A.toast('Reminder deleted.'); } }
        ]
      });
    },
    'notif-test': function () {
      askPermission().then(function (perm) {
        if (perm === 'granted') { pushNotify('A note from care4all', 'This is a test. Nothing about you is shown here.', 'test'); A.toast('Test notification sent.'); }
        else if (perm === 'unsupported') A.toast('Notifications are not available here. Reminders show inside care4all.');
        else A.toast('Notifications are blocked. Reminders show inside care4all.');
        var pt = $('#perm-text', top().el); if (pt) pt.textContent = A.permText();
      });
    },
    guide: function (el) { openGuide(el.getAttribute('data-topic'), el.getAttribute('data-i'), el.getAttribute('data-stage')); },
    'guide-next': function () { if (guide) { guide.i++; drawGuide(); } },
    'guide-back': function () { if (!guide) return; if (guide.stage === 'find') { guide.stage = 'steps'; drawGuide(); } else if (guide.i > 0) { guide.i--; drawGuide(); } },
    'guide-record': function () { if (guide) { guide.stage = 'find'; drawGuide(); } },
    'check-elig': function (el) { runElig(el.getAttribute('data-kind')); },
    'read-opts': openReadOpts,
    listen: toggleListen,
    'plain-switch': function (el) {
      S.prefs.plain = !S.prefs.plain; A.save('prefs');
      $$('[data-action="plain-switch"]').forEach(function (b) { b.setAttribute('aria-checked', String(!!S.prefs.plain)); });
      A.tap(); A.refresh();
    },
    'motion-switch': function (el) {
      S.prefs.motion = S.prefs.motion === false; A.save('prefs'); applyPrefs();
      el.setAttribute('aria-checked', String(S.prefs.motion !== false)); A.tap();
    },
    example: function () {
      S.consent = { v: 1, ts: Date.now(), analytics: false, research: false, example: true }; A.save('consent');
      S.profile = JSON.parse(JSON.stringify(D.EXAMPLE)); A.save('profile'); A.go('plan');
    },
    'note-menu': function (el) {
      var n = S.notes.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (!n) return;
      actionSheet({
        title: A.tname(n.topic) + ' note', message: A.fmtDate(n.ts),
        actions: [
          { label: 'Copy note', run: function () { doCopy(noteText(n), 'Copied. Paste it into a message or bring it to your appointment.'); } },
          { label: n.still === 'No, it has gone' ? 'Mark as still there' : 'Mark as gone', run: function () { n.still = n.still === 'No, it has gone' ? 'Yes' : 'No, it has gone'; A.save('notes'); A.refresh(); A.toast(n.still === 'Yes' ? 'Marked as still there.' : 'Marked as gone. I will stop suggesting it.'); } },
          { label: 'Delete note', kind: 'destructive', run: function () { S.notes = S.notes.filter(function (x) { return x.id !== n.id; }); A.save('notes'); A.refresh(); A.toast('Note deleted.'); } }
        ]
      });
    },
    'copy-note': function (el) {
      var n = S.notes.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (n) doCopy(noteText(n), 'Copied. Paste it into a message or bring it to your appointment.');
    },
    report: function () {
      A.sheet.open({ title: 'Report a problem', html: '<form class="form" data-form="report" novalidate><div class="fgroup"><label class="h3" for="rp">What is wrong or out of date?</label><textarea class="textarea" id="rp" name="msg" maxlength="600" aria-describedby="h-rp"></textarea><p class="fnote" id="h-rp">In this prototype, reports are not sent anywhere.</p></div>' +
        '<div class="stack"><button class="btn primary block" type="submit">Send</button><button class="btn ghost block" type="button" data-action="sheet-close">' + t('cancel') + '</button></div></form>' });
    },
    export: function () {
      var text = JSON.stringify({ exportedAt: new Date().toISOString(), profile: S.profile, consent: S.consent, answers: S.answers, checks: S.checks, checkResults: S.checklog, scans: S.scans, read: S.read, symptomDraft: S.sym.draft, prefs: S.prefs, reminders: S.reminders, notes: S.notes }, null, 2);
      if (!A.IN_FRAME && download('care4all-my-data.json', 'application/json', text)) { A.toast('File downloaded.'); return; }
      openText({ kicker: 'Your data', title: 'Export my data', text: text, file: 'care4all-my-data.json', mime: 'application/json', help: 'This is everything care4all stores about you, on this device only.' });
    },
    wipe: function () {
      actionSheet({ title: 'Delete everything?', message: 'This removes your profile, reminders and notes from this device. It cannot be undone.',
        actions: [{ label: 'Delete everything', kind: 'destructive', run: function () {
          A.store.wipe(); A.resetState(); applyPrefs(); A.ui.q = ''; A.ui.seg = {}; A.ui.open = {}; A.chat.log = []; A.chat.ctx = ''; A.sx.you.editing = A.sx.you.fresh = A.sx.sym.editing = A.sx.sym.fresh = null;
          A.go('welcome'); A.toast('Everything is deleted from this device.');
        } }] });
    }
  };
  /* Handlers registered by other files (coach.js, views2.js) join the table. */
  Object.keys(A.actions).forEach(function (k) { ACTIONS[k] = A.actions[k]; });
  A.run = function (name, el) { var f = ACTIONS[name]; if (f) f(el || { getAttribute: function () { return ''; } }); };
  A.open = { guide: openGuide, log: function (tp) { A.symStart(tp); }, reminder: openReminder, ask: openAsk, copy: doCopy, noteText: noteText, elig: runElig, action: actionSheet, text: openText };

  function el_toggleClear(on) { var c = $('.searchbar .clear', top().el); if (c) c.hidden = !on; }

  /* ---------- events ---------- */
  function onClick(e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
    if (el) {
      var fn = ACTIONS[el.getAttribute('data-action')];
      if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el, e); }
      return;
    }
    var tab = e.target && e.target.closest ? e.target.closest('a[data-nav]') : null;
    if (tab && tab.getAttribute('href') === location.hash && top()) {
      e.preventDefault();
      try { top().sc.scrollTo({ top: 0, behavior: A.reduceMotion() ? 'auto' : 'smooth' }); } catch (x) { top().sc.scrollTop = 0; }
      return;
    }
    var l = e.target && e.target.closest ? e.target.closest('a[data-scroll]') : null;
    if (l) {
      nav.pendingScroll = l.getAttribute('data-scroll');
      if (l.getAttribute('href') === location.hash) { e.preventDefault(); var id = nav.pendingScroll; nav.pendingScroll = null; scrollToId(id); }
    }
  }
  function onSubmit(e) {
    var form = e.target.closest ? e.target.closest('[data-form]') : null;
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute('data-form');
    if (A.forms[kind]) { A.forms[kind](form, e); return; }
    if (kind === 'ask-in') { var i2 = field(form, 'q'); ask(i2.value); i2.value = ''; i2.focus(); }
    else if (kind === 'profile') submitProfile(form);
    else if (kind === 'reminder') submitReminder(form);
    else if (kind === 'report') { A.sheet.close(); A.toast('Thanks. This prototype does not send reports anywhere.'); }
  }
  function onChange(e) {
    var el = e.target;
    if (el.name === 'sex' || el.getAttribute('data-pref')) {
      var seg = el.closest('.seg');
      if (seg) setSeg(seg, $$('label', seg).indexOf(el.closest('label')));
    }
    if (el.getAttribute && el.getAttribute('data-pref')) {
      if (el.getAttribute('data-pref') === 'scale') { S.prefs.scale = +el.value; A.save('prefs'); applyPrefs(); A.tap(); }
      if (el.getAttribute('data-pref') === 'skin') { S.prefs.skin = +el.value; A.save('prefs'); applyPrefs(); A.tap(); $$('input[data-pref="skin"]').forEach(function (r) { r.checked = r.value === el.value; var sg = r.closest('.seg'); if (sg && r.checked) setSeg(sg, $$('label', sg).indexOf(r.closest('label'))); }); }
      return;
    }
    var form = el.closest && el.closest('form');
    if (!form) return;
    var kind = form.getAttribute('data-form');
    if (A.changes[kind]) A.changes[kind](el, form);
    if (kind === 'reminder' && el.name === 'when') $('#date-field', form).hidden = el.value !== 'date';
  }
  function onInput(e) {
    var el = e.target;
    if (el.name === 'yob' && el.getAttribute('aria-invalid')) {
      el.removeAttribute('aria-invalid');
      var c = el.closest('.cell.field'); if (c) c.removeAttribute('data-invalid');
      var p = $('#e-yob'); if (p) { p.hidden = true; p.textContent = ''; }
    }
    var fm = el.closest && el.closest('[data-form]');
    if (fm && A.inputs && A.inputs[fm.getAttribute('data-form')]) A.inputs[fm.getAttribute('data-form')](el, fm);
    if (el.hasAttribute && el.hasAttribute('data-search')) {
      A.ui.q = el.value;
      $('#results', top().el).innerHTML = A.searchResults(A.ui.q);
      el_toggleClear(!!el.value);
    }
  }

  /* ---------- service worker, install, keyboard ---------- */
  function registerSW() {
    if (A.IN_FRAME || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; })
      .then(function () { A.offlineReady = true; }).catch(function () { /* offline mode unavailable */ });
  }
  function bindKeyboard() {
    var vv = window.visualViewport;
    if (!vv) return;
    function fit() { appEl.style.setProperty('--kb', Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) + 'px'); }
    vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
  }

  /* ---------- init ---------- */
  function start() {
    stackEl = $('#stack'); appEl = $('#app'); liveEl = $('#live'); toastsEl = $('#toasts'); sheetRoot = $('#sheet-root');
    $$('[data-icon]').forEach(function (el) { el.innerHTML = ic(el.getAttribute('data-icon'), 24); });
    applyPrefs();
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', trapKeys);
    window.addEventListener('hashchange', onHash);
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); A.deferredInstall = e; });
    window.addEventListener('appinstalled', function () { A.deferredInstall = null; A.refresh(); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDue(); });
    bindSwipe(); bindKeyboard();
    onHash();
    checkDue();
    setInterval(checkDue, 15000);
    registerSW();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

</body></html>
